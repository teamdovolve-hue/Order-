<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Menu — Order Panel</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:," />
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="brand-icon">🍽️</span>
        <h1 class="brand-name">Our Menu</h1>
      </div>
      <div class="header-right">
        <!-- Greeting chip (shown once customer fills in their info) -->
        <span class="customer-chip hidden" id="customerChip"></span>
        <!-- Table badge — auto-set from ?table= in QR URL -->
        <div class="table-badge" id="tableBadge">Table —</div>
        <!-- Order history -->
        <button class="btn-history" id="historyBtn" aria-label="My Orders">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ── Category Tabs ─────────────────────────────────────────── -->
  <nav class="category-nav" id="categoryNav">
    <div class="category-scroll">
      <!-- Populated by menu.js -->
    </div>
  </nav>

  <!-- ── Main Content ──────────────────────────────────────────── -->
  <main class="main-content" id="mainContent">

    <div class="loading-state" id="loadingState">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <div class="error-state hidden" id="errorState">
      <div class="error-icon">⚠️</div>
      <p class="error-text">Couldn't load the menu.<br/>Please try again.</p>
      <button class="btn-retry" id="retryBtn">Retry</button>
    </div>

    <div class="menu-grid hidden" id="menuGrid"></div>

  </main>

  <!-- ── Cart Bar ───────────────────────────────────────────────── -->
  <div class="cart-bar hidden" id="cartBar">
    <div class="cart-summary">
      <div class="cart-count">
        <span class="cart-count-badge" id="cartCountBadge">0</span>
        <span class="cart-count-label">items</span>
      </div>
      <div class="cart-total" id="cartTotal">₹0.00</div>
    </div>
    <button class="btn-place-order" id="placeOrderBtn">Place Order →</button>
  </div>

  <!-- ── Customer Info Modal (shown once on first Add) ─────────── -->
  <div class="overlay hidden" id="customerModal">
    <div class="overlay-card customer-card">
      <div class="customer-modal-icon">👋</div>
      <h2 class="overlay-title">Quick intro!</h2>
      <p class="overlay-subtitle">We just need your name and number — asked only once.</p>
      <form id="customerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="custName">Your Name</label>
          <input class="form-input" type="text" id="custName"
                 placeholder="e.g. Rahul" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="custPhone">Phone Number</label>
          <input class="form-input" type="tel" id="custPhone"
                 placeholder="10-digit mobile number"
                 maxlength="10" autocomplete="tel" inputmode="numeric" />
        </div>
        <p class="form-error hidden" id="custError"></p>
        <button type="submit" class="btn-overlay-close">Let's Order →</button>
      </form>
    </div>
  </div>

  <!-- ── Order Success Overlay ─────────────────────────────────── -->
  <div class="overlay hidden" id="successOverlay">
    <div class="overlay-card">
      <div class="overlay-icon success-icon">✓</div>
      <h2 class="overlay-title">Order Placed!</h2>
      <p class="overlay-msg" id="overlayMsg">Your order is on its way.</p>
      <button class="btn-overlay-close" id="overlayCloseBtn">Back to Menu</button>
    </div>
  </div>

  <!-- ── Order Error Overlay ───────────────────────────────────── -->
  <div class="overlay hidden" id="errorOverlay">
    <div class="overlay-card error-card">
      <div class="overlay-icon error-icon-lg">✕</div>
      <h2 class="overlay-title">Order Failed</h2>
      <p class="overlay-msg" id="errorOverlayMsg">Something went wrong. Please try again.</p>
      <button class="btn-overlay-close" id="errorOverlayCloseBtn">Close</button>
    </div>
  </div>

  <!-- ── History Backdrop ───────────────────────────────────────── -->
  <div class="history-backdrop hidden" id="historyBackdrop"></div>

  <!-- ── History Drawer (slide up from bottom) ─────────────────── -->
  <div class="history-panel hidden" id="historyPanel">
    <div class="history-drag-handle"></div>
    <div class="history-header">
      <h2 class="history-title">My Orders</h2>
      <button class="history-close-btn" id="historyCloseBtn" aria-label="Close">✕</button>
    </div>
    <div class="history-list" id="historyList">
      <!-- Populated by history.js -->
    </div>
  </div>

  <!-- ── Scripts ───────────────────────────────────────────────── -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
